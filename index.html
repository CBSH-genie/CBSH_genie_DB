<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>충북과학고 공학동아리 DB</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📂</text></svg>">
    <!-- styles.css는 Tailwind 정적 빌드 결과물. 클래스를 새로 쓰면 readme의 한 줄 명령으로 재생성 -->
    <link rel="stylesheet" href="styles.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
        h1 { text-wrap: balance; }

        /* 인라인 SVG 아이콘 (Font Awesome CDN 대체) */
        .icon { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex-shrink: 0; }

        /* 스켈레톤 로딩 애니메이션 */
        .skeleton { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 6px; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* 태그 스타일 */
        .tag { cursor: pointer; transition: background-color 0.2s, color 0.2s; }
        .tag:hover { background-color: #dbeafe; color: #1e40af; }

        /* 플로팅 버튼 애니메이션 */
        .fab { transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s; }
        .fab:hover { transform: scale(1.05); box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3); }
        .fab:active { transform: scale(0.96); }

        /* 모달 열림 애니메이션 (display 토글 시마다 재생) */
        #edit-modal:not(.hidden) { animation: fade-in 0.15s ease-out; }
        #edit-modal:not(.hidden) > div { animation: pop-in 0.18s cubic-bezier(0.2, 0, 0, 1); }
        @keyframes fade-in { from { opacity: 0; } }
        @keyframes pop-in { from { opacity: 0; transform: scale(0.97) translateY(8px); } }

        /* 알림창(토스트) 애니메이션 */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: rgba(31, 41, 55, 0.95); /* 어두운 회색 */
            color: #fff;
            text-align: center;
            border-radius: 50px; /* 둥글게 */
            padding: 12px 24px;
            position: fixed;
            z-index: 100;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 40px; /* 살짝 위로 떠오르는 효과 */
        }
    </style>
</head>
<body class="max-w-3xl mx-auto min-h-screen pb-24 relative">

    <header class="pt-10 pb-6 px-5 bg-white shadow-sm border-b border-gray-100 mb-6">
        <h1 class="text-2xl font-bold text-gray-900 tracking-tight">📂 충북과학고 공학동아리 DB</h1>
        <p class="text-gray-500 text-sm mt-1">관심사가 맞는 선후배를 찾아보세요</p>
    </header>

    <div class="sticky top-4 z-30 px-4 mb-6">
        <div class="relative shadow-lg rounded-2xl bg-white/95 backdrop-blur-md border border-gray-100">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            </div>
            <input type="text" id="search-input" 
                   class="block w-full pl-11 pr-10 py-4 rounded-2xl text-gray-900 placeholder-gray-400 bg-transparent focus:outline-none focus:ring-2 focus:ring-blue-500 transition-shadow text-base"
                   placeholder="이름, 소속, 관심사(예: 보행로봇) 검색...">
            <button id="clear-btn" class="absolute inset-y-0 right-0 pr-4 pl-3 flex items-center text-gray-400 hover:text-gray-600 hidden" onclick="clearSearch()" aria-label="검색어 지우기">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>
            </button>
        </div>
    </div>

    <div id="member-list" class="grid grid-cols-1 md:grid-cols-2 gap-4 px-4">
        <div class="card bg-white p-6 rounded-2xl shadow-sm border border-gray-100 h-40 flex flex-col justify-between">
            <div class="space-y-3">
                <div class="flex justify-between">
                    <div class="skeleton h-6 w-24"></div>
                    <div class="skeleton h-5 w-16"></div>
                </div>
                <div class="skeleton h-4 w-32"></div>
            </div>
            <div class="skeleton h-8 w-full mt-4"></div>
        </div>
        <div class="card bg-white p-6 rounded-2xl shadow-sm border border-gray-100 h-40 hidden md:block"><div class="skeleton w-full h-full"></div></div>
    </div>

    <a id="survey-fab" href="#" target="_blank" 
       class="hidden fixed bottom-6 right-6 bg-blue-600 text-white px-6 py-3.5 rounded-full shadow-xl items-center gap-2 z-50 fab hover:bg-blue-700 group">
        <svg class="icon text-lg group-hover:scale-110 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>
        <span class="font-bold text-base tracking-tight">정보 등록/수정</span>
    </a>

    <!-- 정보 수정 모달 (z-[60]: FAB(z-50)보다 위. 토스트는 z-index:100으로 모달 위에 보이게 함) -->
    <div id="edit-modal" class="hidden fixed inset-0 z-[60] items-end sm:items-center justify-center bg-black/40 px-4 pb-4 sm:pb-0">
        <div class="bg-white w-full max-w-md rounded-2xl p-6 shadow-2xl max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 id="edit-modal-title" class="text-lg font-bold text-gray-900"></h2>
                <button onclick="closeEditModal()" class="text-gray-400 hover:text-gray-600 p-3 -m-3" aria-label="닫기">
                    <svg class="icon text-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            </div>

            <!-- 1단계: PIN 확인 -->
            <div id="edit-step-pin">
                <p class="text-sm text-gray-500 mb-3">본인 확인을 위해 PIN을 입력해주세요.<br>(기본값: 전화번호 뒤 4자리)</p>
                <input id="edit-pin-input" type="password" inputmode="numeric" maxlength="8" autocomplete="off"
                       class="w-full border border-gray-200 rounded-xl px-4 py-3 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="PIN">
                <button id="edit-pin-submit" onclick="verifyPin()"
                        class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 disabled:opacity-50 transition active:scale-[0.96]">
                    확인
                </button>
            </div>

            <!-- 2단계: 정보 수정 폼 -->
            <div id="edit-step-form" class="hidden space-y-3">
                <label class="block text-sm font-medium text-gray-600">현재 소속
                    <input id="edit-org" class="mt-1 w-full border border-gray-200 rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="예: KAIST / 삼성전자">
                </label>
                <label class="block text-sm font-medium text-gray-600">역대 소속
                    <input id="edit-history" class="mt-1 w-full border border-gray-200 rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="예: 충북과학고 → KAIST">
                </label>
                <label class="block text-sm font-medium text-gray-600">전화번호
                    <input id="edit-phone" class="mt-1 w-full border border-gray-200 rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="010-0000-0000">
                </label>
                <label class="block text-sm font-medium text-gray-600">이메일
                    <input id="edit-email" type="email" class="mt-1 w-full border border-gray-200 rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </label>
                <label class="block text-sm font-medium text-gray-600">관심사 <span class="font-normal text-gray-400">(쉼표나 / 로 구분)</span>
                    <input id="edit-interests" class="mt-1 w-full border border-gray-200 rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="예: 로봇/제어, 임베디드">
                </label>
                <label class="block text-sm font-medium text-gray-600">새 PIN <span class="font-normal text-gray-400">(바꿀 때만 입력)</span>
                    <input id="edit-newpin" type="password" inputmode="numeric" maxlength="8" autocomplete="off" class="mt-1 w-full border border-gray-200 rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </label>
                <button id="edit-save" onclick="submitEdit()"
                        class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 disabled:opacity-50 mt-2 transition active:scale-[0.96]">
                    저장
                </button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>

    <script>
        let allMembers = [];

        async function init() {
            createToastElement();
            setupSurveyButton();

            // 캐시가 깨져 있어도 페이지가 죽지 않도록 가드
            try {
                const cachedData = localStorage.getItem("memberData_v2");
                const parsed = cachedData ? JSON.parse(cachedData) : null;
                if (Array.isArray(parsed) && parsed.length > 0) {
                    allMembers = parsed;
                    renderMembers(allMembers);
                }
            } catch (e) {
                localStorage.removeItem("memberData_v2");
            }
            await loadMembers();
        }

        function escapeHtml(s) {
            return String(s ?? "").replace(/[&<>"']/g, c =>
                ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        }

        // 인라인 SVG 아이콘 (Font Awesome CDN 대체)
        const ICON_PATHS = {
            search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>',
            copy: '<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
            route: '<circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/>',
            pen: '<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/>'
        };
        function svgIcon(name, cls = "") {
            return `<svg class="icon ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[name]}</svg>`;
        }

        // onclick="..." 속성 안의 JS 문자열 인자용 (& 를 먼저 이스케이프해야 엔티티 스머글링을 막는다)
        function jsArg(s) {
            return String(s ?? "").replace(/&/g, "&amp;").replace(/\\/g, "\\\\").replace(/'/g, "\\'").replace(/"/g, "&quot;");
        }

        // -----------------------------------------------------------
        // [1] 자동 색상 배정 함수 (이름/소속에 따라 색이 변함)
        // -----------------------------------------------------------
        function getBadgeStyle(text) {
            const styles = [
                'bg-red-50 text-red-600 border-red-100',
                'bg-orange-50 text-orange-600 border-orange-100',
                'bg-amber-50 text-amber-600 border-amber-100',
                'bg-green-50 text-green-600 border-green-100',
                'bg-emerald-50 text-emerald-600 border-emerald-100',
                'bg-teal-50 text-teal-600 border-teal-100',
                'bg-cyan-50 text-cyan-600 border-cyan-100',
                'bg-sky-50 text-sky-600 border-sky-100',
                'bg-blue-50 text-blue-600 border-blue-100',
                'bg-indigo-50 text-indigo-600 border-indigo-100',
                'bg-violet-50 text-violet-600 border-violet-100',
                'bg-purple-50 text-purple-600 border-purple-100',
                'bg-fuchsia-50 text-fuchsia-600 border-fuchsia-100',
                'bg-pink-50 text-pink-600 border-pink-100',
                'bg-rose-50 text-rose-600 border-rose-100'
            ];
            
            let hash = 0;
            for (let i = 0; i < text.length; i++) {
                hash = text.charCodeAt(i) + ((hash << 5) - hash);
            }
            return styles[Math.abs(hash) % styles.length];
        }

        function createToastElement() {
            const toastDiv = document.createElement("div");
            toastDiv.id = "toast";
            toastDiv.innerText = "클립보드에 복사되었습니다.";
            document.body.appendChild(toastDiv);
        }

        function copyToClipboard(text, type) {
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                showToast(`${type}가 복사되었습니다!`);
            }).catch(err => {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand("copy");
                document.body.removeChild(textArea);
                showToast(`${type}가 복사되었습니다!`);
            });
        }

        function showToast(message) {
            const x = document.getElementById("toast");
            x.innerText = message;
            x.className = "show";
            setTimeout(function(){ x.className = x.className.replace("show", ""); }, 2500);
        }

        function setupSurveyButton() {
            const fab = document.getElementById('survey-fab');
            if (typeof SURVEY_URL !== 'undefined' && SURVEY_URL && SURVEY_URL.trim() !== "") {
                fab.href = SURVEY_URL;
                fab.classList.remove('hidden');
                fab.classList.add('flex');
            }
        }

        async function loadMembers() {
            try {
                const response = await fetch(API_URL + "?t=" + Date.now());
                const data = await response.json();
                if (!data.ok) throw new Error(data.error || "api_error");
                const newMembers = data.members;

                if (JSON.stringify(newMembers) !== JSON.stringify(allMembers)) {
                    allMembers = newMembers;
                    localStorage.setItem("memberData_v2", JSON.stringify(allMembers));
                    renderMembers(allMembers);
                }
            } catch (error) {
                console.error(error);
                if (allMembers.length > 0) {
                    showToast("새 데이터를 불러오지 못해 저장된 목록을 표시합니다.");
                } else {
                    showToast("데이터를 불러오지 못했습니다. 잠시 후 다시 시도해주세요.");
                }
            }
        }

        window.filterByTag = function(tag) {
            const searchInput = document.getElementById("search-input");
            searchInput.value = tag;
            searchInput.dispatchEvent(new Event('input'));
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.clearSearch = function() {
            const searchInput = document.getElementById("search-input");
            searchInput.value = '';
            searchInput.dispatchEvent(new Event('input'));
            searchInput.focus();
        }

        function renderMembers(members) {
            const container = document.getElementById("member-list");
            
            if(members.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center text-gray-400 py-20 flex flex-col items-center">${svgIcon('search', 'mb-3 text-2xl')}검색 결과가 없습니다.</div>`;
                return;
            }

            container.innerHTML = members.map(m => {
                // [관심사 태그] 처리
                const interestsHtml = m.interests
                    ? m.interests.split(/[\/,]/).map(t => { const tag = t.trim(); return `<span onclick="filterByTag('${jsArg(tag)}')" class="tag text-xs font-medium px-2.5 py-1 rounded-md bg-slate-100 text-slate-600 mr-1.5 mb-1.5 inline-block border border-slate-200">#${escapeHtml(tag)}</span>`; }).join('')
                    : '';
                
                // [NEW] [직장/학교 태그] 처리 (여러 개 지원 + 컬러풀 + 검색기능)
                const orgHtml = m.org 
                    ? m.org.split(/[\/,]/).map(o => {
                        const orgName = o.trim();
                        if(!orgName) return '';
                        const style = getBadgeStyle(orgName); // 자동 색상 적용
                        return `<span onclick="filterByTag('${jsArg(orgName)}')" class="cursor-pointer text-xs font-bold px-2 py-1 rounded-lg border ${style} ml-1 mb-1 inline-block hover:opacity-80 transition-opacity">${escapeHtml(orgName)}</span>`
                    }).join('')
                    : '<span class="text-xs text-gray-400">-</span>';

                const cohortDisplay = m.cohort ? m.cohort.replace("기", "") + "기" : "";

                const cardBtnCls = "flex-1 bg-white border border-gray-200 text-gray-700 py-2.5 rounded-xl text-center hover:bg-gray-50 transition font-medium text-sm flex items-center justify-center gap-2 cursor-pointer active:bg-gray-100 active:scale-[0.96]";

                const phoneBtn = m.phone
                    ? `<button onclick="copyToClipboard('${jsArg(m.phone)}', '전화번호')" class="${cardBtnCls}">
                        ${svgIcon('copy', 'text-green-600')} 번호복사
                       </button>`
                    : '';

                const emailBtn = m.email
                    ? `<button onclick="copyToClipboard('${jsArg(m.email)}', '이메일')" class="${cardBtnCls}">
                        ${svgIcon('copy', 'text-blue-600')} 메일복사
                       </button>`
                    : '';

                const historyHtml = m.history
                    ? `<div class="text-xs text-gray-400 mt-1.5 flex items-start gap-1.5">
                         ${svgIcon('route', 'mt-0.5')}<span>${escapeHtml(m.history)}</span>
                       </div>`
                    : '';

                const updatedHtml = m.updatedAt
                    ? `<span class="text-[11px] text-gray-300">최종수정 ${escapeHtml(m.updatedAt)}</span>`
                    : '<span></span>';

                const editBtn = `<button onclick="openEditModal('${jsArg(m.name)}', '${jsArg(m.cohort)}')"
                    class="${cardBtnCls}">
                    ${svgIcon('pen', 'text-gray-500')} 수정
                   </button>`;

                return `
                <div class="card bg-white p-5 rounded-2xl shadow-[0_2px_8px_rgba(0,0,0,0.04)] border border-gray-100 flex flex-col justify-between h-full hover:border-blue-200 transition-colors">
                    <div>
                        <div class="flex flex-col gap-2 mb-3">
                            <div class="flex justify-between items-start">
                                <h3 class="text-xl font-bold text-gray-900 tracking-tight flex items-center gap-2">
                                    ${escapeHtml(m.name)}
                                    <span class="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full">${escapeHtml(cohortDisplay)}</span>
                                </h3>
                                <span class="text-xs text-gray-400 mt-1">${escapeHtml(m.role || '부원')}</span>
                            </div>
                            
                            <div class="flex flex-wrap items-center">
                                ${orgHtml}
                            </div>
                            ${historyHtml}
                        </div>

                        <div class="mb-5 min-h-[24px]">${interestsHtml}</div>
                    </div>
                    <div class="flex gap-2 mt-auto pt-4 border-t border-gray-50">
                        ${phoneBtn} ${emailBtn} ${editBtn}
                    </div>
                    <div class="flex justify-end mt-2">${updatedHtml}</div>
                </div>`;
            }).join("");
        }

        const searchInput = document.getElementById("search-input");
        const clearBtn = document.getElementById("clear-btn");
        searchInput.addEventListener("input", (e) => {
            const term = e.target.value.toLowerCase();
            if(term.length > 0) clearBtn.classList.remove('hidden');
            else clearBtn.classList.add('hidden');
            const filtered = allMembers.filter(m =>
                (m.name && m.name.toLowerCase().includes(term)) ||
                (m.org && m.org.toLowerCase().includes(term)) ||
                (m.interests && m.interests.toLowerCase().includes(term)) ||
                (m.cohort && m.cohort.toLowerCase().includes(term)) ||
                (m.history && m.history.toLowerCase().includes(term))
            );
            renderMembers(filtered);
        });

        // ===== 정보 수정 모달 =====
        let editTarget = null; // { name, cohort, pin }

        async function postApi(payload) {
            const response = await fetch(API_URL, {
                method: "POST",
                // Content-Type을 text/plain으로 보내면 CORS preflight 없이 Apps Script로 전송 가능
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            });
            return response.json();
        }

        window.openEditModal = function(name, cohort) {
            editTarget = { name, cohort, pin: null };
            document.getElementById("edit-modal-title").innerText = `${name} (${cohort}기) 정보 수정`;
            document.getElementById("edit-pin-input").value = "";
            document.getElementById("edit-step-pin").classList.remove("hidden");
            document.getElementById("edit-step-form").classList.add("hidden");
            const modal = document.getElementById("edit-modal");
            modal.classList.remove("hidden");
            modal.classList.add("flex");
            document.getElementById("edit-pin-input").focus();
        }

        window.closeEditModal = function() {
            const modal = document.getElementById("edit-modal");
            modal.classList.add("hidden");
            modal.classList.remove("flex");
            editTarget = null;
        }

        window.verifyPin = async function() {
            const pin = document.getElementById("edit-pin-input").value.trim();
            if (!pin) { showToast("PIN을 입력해주세요."); return; }
            const btn = document.getElementById("edit-pin-submit");
            btn.disabled = true;
            try {
                const data = await postApi({ name: editTarget.name, cohort: editTarget.cohort, pin, fields: {} });
                if (!editTarget) return; // 요청 중 모달이 닫힌 경우
                if (!data.ok) {
                    showToast(data.error === "wrong_pin" ? "PIN이 일치하지 않습니다." : "확인에 실패했습니다. 기장에게 문의해주세요.");
                    return;
                }
                editTarget.pin = pin;
                document.getElementById("edit-org").value = data.member.org || "";
                document.getElementById("edit-history").value = data.member.history || "";
                document.getElementById("edit-phone").value = data.member.phone || "";
                document.getElementById("edit-email").value = data.member.email || "";
                document.getElementById("edit-interests").value = data.member.interests || "";
                document.getElementById("edit-newpin").value = "";
                document.getElementById("edit-step-pin").classList.add("hidden");
                document.getElementById("edit-step-form").classList.remove("hidden");
            } catch (err) {
                console.error(err);
                showToast("네트워크 오류가 발생했습니다. 다시 시도해주세요.");
            } finally {
                btn.disabled = false;
            }
        }

        window.submitEdit = async function() {
            const fields = {
                org: document.getElementById("edit-org").value.trim(),
                history: document.getElementById("edit-history").value.trim(),
                phone: document.getElementById("edit-phone").value.trim(),
                email: document.getElementById("edit-email").value.trim(),
                interests: document.getElementById("edit-interests").value.trim()
            };
            const newPin = document.getElementById("edit-newpin").value.trim();
            if (newPin) fields.pin = newPin;

            const btn = document.getElementById("edit-save");
            btn.disabled = true;
            try {
                const data = await postApi({ name: editTarget.name, cohort: editTarget.cohort, pin: editTarget.pin, fields });
                if (!editTarget) return; // 요청 중 모달이 닫힌 경우
                if (!data.ok) {
                    showToast("저장에 실패했습니다. 다시 시도해주세요.");
                    return;
                }
                const idx = allMembers.findIndex(m => m.name === editTarget.name && m.cohort === editTarget.cohort);
                if (idx !== -1) allMembers[idx] = data.member;
                localStorage.setItem("memberData_v2", JSON.stringify(allMembers));
                renderMembers(allMembers);
                closeEditModal();
                showToast("정보가 수정되었습니다!");
            } catch (err) {
                console.error(err);
                showToast("네트워크 오류가 발생했습니다. 다시 시도해주세요.");
            } finally {
                btn.disabled = false;
            }
        }

        // 모달 바깥 클릭 시 닫기
        document.getElementById("edit-modal").addEventListener("click", (e) => {
            if (e.target.id === "edit-modal") closeEditModal();
        });

        init();
    </script>
</body>
</html>
